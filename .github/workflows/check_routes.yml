name: Route watcher

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Print a sample email without sending or saving state'
        required: false
        default: false
        type: boolean
      force_send:
        description: 'Send email even on first run'
        required: false
        default: false
        type: boolean

jobs:
  check-routes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore seen routes cache
        uses: actions/cache@v4
        with:
          path: seen_routes.json
          key: route-watcher-state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run route watcher
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_SEND: ${{ inputs.force_send }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test_mode }}" = "true" ]; then
            python check_routes.py --test
          else
            python check_routes.py
          fi

      - name: Save seen routes cache
        uses: actions/cache@v4
        with:
          path: seen_routes.json
          key: route-watcher-state
